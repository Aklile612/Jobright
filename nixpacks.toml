# EthioDeploy always uses Nixpacks. Their nixpkgs pin has no `go_1_22`
# package, so we install official Go from go.dev instead.

[phases.setup]
aptPkgs = ["curl", "ca-certificates", "gcc", "libc6-dev"]

[phases.install]
cmds = [
  "curl -fsSL https://go.dev/dl/go1.22.12.linux-amd64.tar.gz -o /tmp/go.tgz",
  "rm -rf /usr/local/go && tar -C /usr/local -xzf /tmp/go.tgz",
  "/usr/local/go/bin/go version",
  "cd services/api && /usr/local/go/bin/go mod download"
]

[phases.build]
cmds = [
  "mkdir -p /app/bin /app/storage/resumes",
  "cd services/api && CGO_ENABLED=0 /usr/local/go/bin/go build -o /app/bin/api ./cmd/server",
  "cp -R services/api/scripts /app/scripts || true"
]

[start]
cmd = "/app/bin/api"

[variables]
PATH = "/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
UPLOAD_DIR = "/app/storage/resumes"
STAMP_PDF_SCRIPT = "/app/scripts/stamp_pdf.py"
PORT = "8080"
