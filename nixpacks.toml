# Monorepo: language lives in services/api, not at repo root.
# EthioDeploy wraps this Nixpacks plan in Docker.

[phases.setup]
# Must be >= go.mod (1.22). Plain "go" is often too old → "cannot compile Go 1.22 code".
nixPkgs = ["go_1_22"]

[phases.install]
cmds = [
  "go version",
  "cd services/api && go mod download"
]

[phases.build]
cmds = [
  "mkdir -p /app/bin /app/storage/resumes",
  "cd services/api && CGO_ENABLED=0 go build -o /app/bin/api ./cmd/server",
  "cp -R services/api/scripts /app/scripts || true"
]

[start]
cmd = "/app/bin/api"

[variables]
NIXPACKS_GO_VERSION = "1.22"
UPLOAD_DIR = "/app/storage/resumes"
STAMP_PDF_SCRIPT = "/app/scripts/stamp_pdf.py"
PORT = "8080"
